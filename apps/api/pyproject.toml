[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "red-team-arena-api"
version = "0.1.0"
description = "Phase 1 API foundation for Red-Team Arena"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "huggingface_hub>=1.27,<2.0",
  "nemoguardrails>=0.23,<0.24",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
